<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Almuslim</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #0b2418;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .logo {
            width: 300px;

            animation: putar 4s linear infinite;

            transform-style: preserve-3d;
        }

        @keyframes putar {
            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>

<body>

    <img src="img/logoalmuslim.jpeg" class="logo" style="border-radius: 50%;">

</body>
</html>
